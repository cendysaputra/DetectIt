[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detectit"
version = "0.1.0"
description = "Object detection with YOLO for images and video"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.11.0.86",
    "pillow==11.3.0",
    "pyyaml==6.0.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "ultralytics==8.3.228",
    "pycocotools==2.0.10",
]

[project.optional-dependencies]
app = ["streamlit==1.51.0"]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
